global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: local

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: fantasyiq-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels: { service: backend }

  - job_name: fantasyiq-ml
    metrics_path: /metrics
    static_configs:
      - targets: ["ml-service:9000"]
        labels: { service: ml }

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
