name: fantasyiq

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fantasyiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_locally}
      POSTGRES_DB: ${POSTGRES_DB:-fantasyiq}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fantasyiq} -d ${POSTGRES_DB:-fantasyiq}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ml-service:
    build: ./ml-service
    env_file: [.env]
    environment:
      MODEL_DIR: /models
    ports: ["9000:9000"]
    volumes:
      - ./ml-service:/app
      - model-artifacts:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file: [.env]
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      ML_SERVICE_URL: http://ml-service:9000
    ports: ["8000:8000"]
    volumes:
      - ./backend:/app
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      ml-service: {condition: service_started}
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  pipeline:
    build: ./pipeline
    env_file: [.env]
    environment:
      POSTGRES_HOST: postgres
      ML_SERVICE_URL: http://ml-service:9000
    volumes:
      - ./pipeline:/app
      - pipeline-data:/data
      # Hand-downloaded parquet files, for networks that block the container.
      - ./data/manual:/data/manual:ro
    depends_on:
      postgres: {condition: service_healthy}
    # Long-running scheduler; use `make ingest` to trigger a one-off run.
    command: ["python", "-m", "scheduler"]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports: ["3000:80"]
    depends_on: [backend]

  prometheus:
    image: prom/prometheus:v2.54.1
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus

  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on: [prometheus]

volumes:
  pgdata:
  promdata:
  grafanadata:
  model-artifacts:
  pipeline-data:
