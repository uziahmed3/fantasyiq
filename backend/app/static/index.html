<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FantasyIQ — Draft Board</title>
<!--
  Zero-build dashboard: no React, no npm, served straight off disk by FastAPI.

  Two modes, and the API decides which one applies rather than the UI guessing from a
  date. /api/v1/rankings/season reports `season_started`:

    false -> DRAFT BOARD. Season-long projections for the upcoming season, from the
             preseason model. Ranked by projected points per game, with a season total.
             This is the only useful view in the offseason, when no team has played.

    true  -> WEEKLY. Once real games exist, rolling form is far more informative than a
             preseason guess, so the week selector appears and the weekly endpoint takes
             over.
-->
<style>
  :root{--bg:#0d1117;--panel:#161b22;--border:#262d36;--text:#e6edf3;--muted:#8b949e;
        --accent:#4f9cf9;--good:#3fb950;--bad:#f85149;--warn:#d29922;--rookie:#a371f7}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 20px 70px}
  h1{font-size:23px;margin:0;letter-spacing:-.02em;display:inline-block}
  .tag{color:var(--muted);font-size:13px;margin-left:10px}
  .sub{color:var(--muted);font-size:13px;margin:6px 0 18px}
  .controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center}
  select,input,button{background:var(--panel);color:var(--text);border:1px solid var(--border);
       border-radius:6px;padding:7px 11px;font-size:13px;font-family:inherit}
  button{cursor:pointer} button:hover{border-color:var(--accent)}
  button.pos{min-width:52px;font-weight:600}
  button.pos.on{background:var(--accent);border-color:var(--accent);color:#06121f}
  button.primary{background:var(--accent);border-color:var(--accent);color:#06121f;font-weight:600}
  button:disabled{opacity:.5;cursor:not-allowed}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;
         padding:16px;margin-bottom:18px}
  .panel h2{font-size:12px;margin:0 0 4px;text-transform:uppercase;letter-spacing:.07em;
            color:var(--muted);font-weight:600}
  .panel .note{color:var(--muted);font-size:12px;margin:0 0 12px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--muted);font-weight:500;padding:8px 10px;
     border-bottom:1px solid var(--border);white-space:nowrap}
  td{padding:9px 10px;border-bottom:1px solid rgba(38,45,54,.6)}
  tr.clickable:hover{background:rgba(79,156,249,.08);cursor:pointer}
  tr.selected{background:rgba(79,156,249,.14)}
  .rank{color:var(--muted);width:40px}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .pts{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;color:var(--good)}
  .total{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
  .why{color:var(--muted);font-size:12px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:860px){.grid2{grid-template-columns:1fr}}
  .kv{display:flex;justify-content:space-between;padding:6px 0;
      border-bottom:1px solid rgba(38,45,54,.6)}
  .kv span:first-child{color:var(--muted)}
  .badge{font-size:11px;padding:2px 7px;border-radius:4px;background:rgba(79,156,249,.15);
         color:var(--accent);white-space:nowrap}
  .badge.rookie{background:rgba(163,113,247,.18);color:var(--rookie)}
  .badge.cache{background:rgba(63,185,80,.15);color:var(--good)}
  .badge.model{background:rgba(210,153,34,.15);color:var(--warn)}
  .conf{display:inline-block;width:44px;height:5px;background:rgba(255,255,255,.10);
        border-radius:3px;overflow:hidden;vertical-align:middle}
  .conf i{display:block;height:100%;background:var(--accent)}
  .err{color:var(--bad);font-size:13px;margin:8px 0}
  .empty{color:var(--muted);font-size:13px;padding:8px 0;line-height:1.7}
  code{background:rgba(255,255,255,.07);padding:1px 5px;border-radius:4px;font-size:12px}
  .spark{display:flex;align-items:flex-end;gap:3px;height:54px;margin:12px 0 4px}
  .spark div{flex:1;background:var(--accent);border-radius:2px 2px 0 0;min-height:2px;opacity:.85}
  .sparklabels{display:flex;gap:3px;color:var(--muted);font-size:10px}
  .sparklabels span{flex:1;text-align:center}
  footer{color:var(--muted);font-size:12px;margin-top:26px;line-height:1.7}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}
  .dot.ok{background:var(--good)} .dot.bad{background:var(--bad)}
  .caveat{background:rgba(210,153,34,.08);border:1px solid rgba(210,153,34,.25);
          border-radius:8px;padding:10px 13px;color:var(--muted);font-size:12px;
          margin-bottom:18px;line-height:1.65}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">FantasyIQ</h1><span class="tag" id="mode-tag"></span>
    <p class="sub" id="status">connecting…</p>
  </header>

  <div class="caveat" id="caveat" style="display:none"></div>

  <div class="controls">
    <span id="positions"></span>
    <span id="week-controls" style="display:none">
      <select id="week"></select>
    </span>
    <button id="refresh">Refresh</button>
    <span id="meta" class="tag"></span>
  </div>

  <div id="error"></div>

  <div class="panel">
    <h2 id="board-title">Projections</h2>
    <p class="note" id="board-note"></p>
    <div id="board"><p class="empty">loading…</p></div>
  </div>

  <div class="grid2">
    <div class="panel">
      <h2>Player detail</h2>
      <div id="player"><p class="empty">Select a player from the board.</p></div>
    </div>
    <div class="panel">
      <h2>Single-game projection</h2>
      <div class="controls">
        <input id="opponent" value="GB" size="6" maxlength="4" placeholder="Opp">
        <button class="primary" id="project" disabled>Project</button>
        <button id="again" disabled title="Same request again — watch source flip to cache">Again</button>
      </div>
      <div id="projection"><p class="empty">Pick a player first.</p></div>
    </div>
  </div>

  <footer>
    API <a href="/docs" style="color:var(--accent)">/docs</a> ·
    metrics <a href="/metrics" style="color:var(--accent)">/metrics</a> ·
    readiness <a href="/ready" style="color:var(--accent)">/ready</a><br>
    Projections are model output, not advice.
  </footer>
</div>

<script>
const API = "/api/v1";
const POSITIONS = ["WR", "RB", "TE", "QB"];
let state = { position: "WR", season: null, week: null, started: false, selected: null };

const $ = id => document.getElementById(id);
const showError = m => { $("error").innerHTML = m ? `<p class="err">${m}</p>` : ""; };

async function api(path, opts) {
  const res = await fetch(API + path, {
    headers: { "Content-Type": "application/json" }, ...opts
  });
  if (!res.ok) {
    let detail = `${res.status} ${res.statusText}`;
    try { const b = await res.json(); if (typeof b.detail === "string") detail = b.detail; } catch {}
    throw new Error(detail);
  }
  return res.json();
}

function confBar(c) {
  if (c == null) return "—";
  const pct = Math.round(c * 100);
  return `<span class="conf" title="confidence ${c.toFixed(2)}"><i style="width:${pct}%"></i></span>`;
}

// ---- position buttons ------------------------------------------------------
$("positions").innerHTML = POSITIONS
  .map(p => `<button class="pos${p === state.position ? " on" : ""}" data-pos="${p}">${p}</button>`)
  .join("");
$("positions").onclick = e => {
  const pos = e.target.dataset.pos;
  if (!pos) return;
  state.position = pos;
  document.querySelectorAll("#positions .pos").forEach(b =>
    b.classList.toggle("on", b.dataset.pos === pos));
  load();
};

async function health() {
  try {
    const r = await fetch("/ready").then(x => x.json());
    $("status").innerHTML =
      `<span class="dot ${r.ready ? "ok" : "bad"}"></span>` +
      `database ${r.checks.database ? "up" : "down"} · ` +
      `model service ${r.checks.ml_service ? "up" : "down"}`;
  } catch { $("status").textContent = "API unreachable"; }
}

// ---- the board -------------------------------------------------------------
async function load() {
  $("board").innerHTML = `<p class="empty">loading…</p>`;
  showError("");
  try {
    // Ask for the season board first: its response tells us whether the season has
    // started, which decides the whole layout.
    const d = await api(`/rankings/season?position=${state.position}&limit=150`);
    state.season = d.season;
    state.started = d.season_started;

    if (!d.season_started) return renderDraftBoard(d);
    return renderWeekly(d.season);
  } catch (e) {
    showError(e.message);
    $("board").innerHTML = "";
  }
}

function renderDraftBoard(d) {
  $("title").textContent = `FantasyIQ ${d.season} Draft Board`;
  $("mode-tag").textContent = "season-long projections";
  $("week-controls").style.display = "none";
  $("board-title").textContent = `${d.position} — projected ${d.season} season`;
  $("board-note").textContent =
    `Ranked by projected points per game. Season total assumes ${d.games_assumed} games.`;
  $("meta").textContent = `model: ${d.model_version}`;
  $("caveat").style.display = "";
  $("caveat").innerHTML =
    `<b>${d.season} has not started.</b> These come from the preseason model, which uses last ` +
    `season's production, target share, snap share, depth-chart position, draft capital and ` +
    `whether the team's quarterback changed. A rookie's number rests on draft position and ` +
    `projected role only — the confidence bar reflects that. Season totals assume a healthy ` +
    `${d.games_assumed}-game season, which is optimistic for any individual player.`;

  if (!d.rankings.length) {
    $("board").innerHTML =
      `<p class="empty">No ${d.position} projections stored for ${d.season} yet.<br>
       Generate them from the <code>pipeline</code> folder:
       <code>python -m preseason --season ${d.season}</code></p>`;
    return;
  }

  $("board").innerHTML = `<table><thead><tr>
      <th class="rank">#</th><th>Player</th><th>Team</th>
      <th class="num">Pts/Game</th><th class="num">Season</th>
      <th>Conf</th><th>Basis</th></tr></thead><tbody>` +
    d.rankings.map(r => `<tr class="clickable" data-id="${r.player_id}">
      <td class="rank">${r.rank}</td>
      <td>${r.name}${r.is_rookie ? ' <span class="badge rookie">R</span>' : ""}</td>
      <td>${r.team || "—"}</td>
      <td class="pts">${r.projected_points_per_game.toFixed(1)}</td>
      <td class="total">${r.projected_season_points.toFixed(0)}</td>
      <td>${confBar(r.confidence)}</td>
      <td class="why">${r.basis || ""}</td></tr>`).join("") +
    `</tbody></table>`;
  wireRows();
}

async function renderWeekly(season) {
  // The season is under way, so rolling form beats a preseason guess.
  $("title").textContent = `FantasyIQ ${season}`;
  $("mode-tag").textContent = "weekly projections";
  $("caveat").style.display = "none";
  $("week-controls").style.display = "";
  if (!$("week").options.length) {
    $("week").innerHTML = Array.from({ length: 18 }, (_, i) => i + 1)
      .map(w => `<option value="${w}">Week ${w}</option>`).join("");
    $("week").onchange = () => renderWeekly(season);
  }
  const week = Number($("week").value) || 1;
  $("board-title").textContent = `${state.position} — week ${week}`;
  $("board-note").textContent = "Ranked by projected points for this week, from recent form.";

  const d = await api(
    `/rankings?week=${week}&season=${season}&position=${state.position}&limit=100`);
  $("meta").textContent = `model: ${d.model_version}`;

  if (!d.rankings.length) {
    $("board").innerHTML =
      `<p class="empty">No projections stored for ${state.position} week ${week}.<br>
       Run <code>python -m run_weekly</code> from the pipeline folder.</p>`;
    return;
  }
  $("board").innerHTML = `<table><thead><tr>
      <th class="rank">#</th><th>Player</th><th>Team</th>
      <th>Conf</th><th class="num">Projected</th></tr></thead><tbody>` +
    d.rankings.map(r => `<tr class="clickable" data-id="${r.player_id}">
      <td class="rank">${r.rank}</td><td>${r.name}</td><td>${r.team || "—"}</td>
      <td>${confBar(r.confidence)}</td>
      <td class="pts">${r.projected_points.toFixed(1)}</td></tr>`).join("") +
    `</tbody></table>`;
  wireRows();
}

function wireRows() {
  document.querySelectorAll("#board tr.clickable").forEach(tr =>
    tr.onclick = () => selectPlayer(Number(tr.dataset.id), tr));
}

// ---- player detail ---------------------------------------------------------
async function selectPlayer(id, row) {
  state.selected = id;
  document.querySelectorAll("#board tr").forEach(t => t.classList.remove("selected"));
  if (row) row.classList.add("selected");
  $("project").disabled = false; $("again").disabled = false;
  $("player").innerHTML = `<p class="empty">loading…</p>`;
  try {
    // Show last season's log when the new season has not started.
    const logSeason = state.started ? state.season : state.season - 1;
    const [p, stats] = await Promise.all([
      api(`/players/${id}`), api(`/players/${id}/stats?season=${logSeason}&limit=20`)
    ]);
    const asc = [...stats].sort((a, b) => a.week - b.week);
    const max = Math.max(1, ...asc.map(s => s.fantasy_points));
    const spark = asc.length ? `
      <div class="spark">${asc.map(s =>
        `<div style="height:${Math.max(2, (s.fantasy_points / max) * 100)}%"
              title="Week ${s.week}: ${s.fantasy_points.toFixed(1)}"></div>`).join("")}</div>
      <div class="sparklabels">${asc.map(s => `<span>${s.week}</span>`).join("")}</div>` : "";

    $("player").innerHTML =
      `<div class="kv"><span>Name</span><span>${p.name}</span></div>
       <div class="kv"><span>Team / Position</span><span>${p.team || "—"} · ${p.position}</span></div>
       <div class="kv"><span>Age</span><span>${p.age ?? "—"}</span></div>
       <p class="note" style="margin-top:10px">${logSeason} game log</p>` +
      (asc.length ? spark : `<p class="empty">No ${logSeason} games — likely a rookie.</p>`);
  } catch (e) { showError(e.message); }
}

// ---- single-game projection ------------------------------------------------
async function project() {
  if (!state.selected) return;
  $("project").disabled = true; $("again").disabled = true;
  const t0 = performance.now();
  try {
    const week = state.started ? (Number($("week").value) || 1) : 1;
    const body = await api("/predict", {
      method: "POST",
      body: JSON.stringify({
        player_id: state.selected, week, season: state.season,
        opponent: ($("opponent").value || "UNK").toUpperCase(), is_home: true
      })
    });
    const ms = Math.round(performance.now() - t0);
    $("projection").innerHTML =
      `<div class="kv"><span>Projected</span><span class="pts">${body.prediction.toFixed(1)}</span></div>
       <div class="kv"><span>Confidence</span><span>${body.confidence?.toFixed(2) ?? "—"}</span></div>
       <div class="kv"><span>Model</span><span><span class="badge">${body.model_version}</span></span></div>
       <div class="kv"><span>Mode</span><span>${body.mode}</span></div>
       ${body.basis ? `<div class="kv"><span>Based on</span><span class="why">${body.basis}</span></div>` : ""}
       <div class="kv"><span>Served from</span>
         <span><span class="badge ${body.source}">${body.source}</span> ${ms} ms</span></div>`;
  } catch (e) {
    $("projection").innerHTML = `<p class="err">${e.message}</p>`;
  } finally {
    $("project").disabled = false; $("again").disabled = false;
  }
}

$("refresh").onclick = load;
$("project").onclick = project;
$("again").onclick = project;

health();
load();
setInterval(health, 20000);
</script>
</body>
</html>
