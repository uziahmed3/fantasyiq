<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FantasyIQ</title>
<!--
  Zero-build dashboard. No React, no Vite, no npm - it is served straight off disk by
  FastAPI so the platform has a real UI on a machine with nothing but Python installed.
  The React app in frontend/ is the production front end; this is the local-mode twin
  and talks to exactly the same API.
-->
<style>
  :root{--bg:#0d1117;--panel:#161b22;--border:#262d36;--text:#e6edf3;--muted:#8b949e;
        --accent:#4f9cf9;--good:#3fb950;--bad:#f85149;--warn:#d29922}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:1120px;margin:0 auto;padding:26px 20px 70px}
  h1{font-size:22px;margin:0;letter-spacing:-.02em;display:inline-block}
  .tag{color:var(--muted);font-size:13px;margin-left:10px}
  .sub{color:var(--muted);font-size:13px;margin:6px 0 20px}
  .controls{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;align-items:center}
  select,input,button{background:var(--panel);color:var(--text);border:1px solid var(--border);
       border-radius:6px;padding:7px 10px;font-size:13px;font-family:inherit}
  button{cursor:pointer} button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#06121f;font-weight:600}
  button:disabled{opacity:.5;cursor:not-allowed}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;
         padding:16px;margin-bottom:18px}
  .panel h2{font-size:12px;margin:0 0 12px;text-transform:uppercase;letter-spacing:.07em;
            color:var(--muted);font-weight:600}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--muted);font-weight:500;padding:8px 10px;
     border-bottom:1px solid var(--border)}
  td{padding:9px 10px;border-bottom:1px solid rgba(38,45,54,.6)}
  tr.clickable:hover{background:rgba(79,156,249,.08);cursor:pointer}
  tr.selected{background:rgba(79,156,249,.14)}
  .rank{color:var(--muted);width:36px} .num{text-align:right;font-variant-numeric:tabular-nums}
  .pts{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;color:var(--good)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:820px){.grid2{grid-template-columns:1fr}}
  .kv{display:flex;justify-content:space-between;padding:6px 0;
      border-bottom:1px solid rgba(38,45,54,.6)}
  .kv span:first-child{color:var(--muted)}
  .badge{font-size:11px;padding:2px 7px;border-radius:4px;background:rgba(79,156,249,.15);
         color:var(--accent)}
  .badge.cache{background:rgba(63,185,80,.15);color:var(--good)}
  .badge.model{background:rgba(210,153,34,.15);color:var(--warn)}
  .err{color:var(--bad);font-size:13px;margin:8px 0}
  .empty{color:var(--muted);font-size:13px;padding:8px 0}
  code{background:rgba(255,255,255,.07);padding:1px 5px;border-radius:4px;font-size:12px}
  .spark{display:flex;align-items:flex-end;gap:3px;height:56px;margin:12px 0 4px}
  .spark div{flex:1;background:var(--accent);border-radius:2px 2px 0 0;min-height:2px;opacity:.85}
  .spark div:hover{opacity:1}
  .sparklabels{display:flex;gap:3px;color:var(--muted);font-size:10px}
  .sparklabels span{flex:1;text-align:center}
  footer{color:var(--muted);font-size:12px;margin-top:26px;line-height:1.7}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}
  .dot.ok{background:var(--good)} .dot.bad{background:var(--bad)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>FantasyIQ</h1><span class="tag">NFL fantasy point projections</span>
    <p class="sub" id="status">connecting…</p>
  </header>

  <div class="controls">
    <select id="position"><option>WR</option><option>RB</option><option>TE</option><option>QB</option></select>
    <select id="week"></select>
    <select id="season"></select>
    <button id="refresh">Refresh</button>
    <span id="meta" class="tag"></span>
  </div>

  <div id="error"></div>

  <div class="panel">
    <h2>Projected leaderboard</h2>
    <div id="rankings"><p class="empty">loading…</p></div>
  </div>

  <div class="grid2">
    <div class="panel">
      <h2>Game log</h2>
      <div id="player"><p class="empty">Select a player from the leaderboard.</p></div>
    </div>
    <div class="panel">
      <h2>On-demand projection</h2>
      <div class="controls">
        <input id="opponent" value="GB" size="6" maxlength="4" placeholder="Opp">
        <button class="primary" id="project" disabled>Project</button>
        <button id="projectAgain" disabled title="Same request again - watch the source flip to cache">Again</button>
      </div>
      <div id="projection"><p class="empty">Pick a player first.</p></div>
    </div>
  </div>

  <footer>
    API <a href="/docs" style="color:var(--accent)">/docs</a> ·
    metrics <a href="/metrics" style="color:var(--accent)">/metrics</a> ·
    readiness <a href="/ready" style="color:var(--accent)">/ready</a><br>
    Projections are model output, not advice.
  </footer>
</div>

<script>
const API = "/api/v1";
let selected = null;

const $ = id => document.getElementById(id);
const showError = msg => { $("error").innerHTML = msg ? `<p class="err">${msg}</p>` : ""; };

async function api(path, opts) {
  const res = await fetch(API + path, {
    headers: {"Content-Type": "application/json"}, ...opts
  });
  if (!res.ok) {
    let detail = `${res.status} ${res.statusText}`;
    try { const b = await res.json(); if (typeof b.detail === "string") detail = b.detail; } catch {}
    throw new Error(detail);
  }
  return res.json();
}

// ---- setup selectors -------------------------------------------------------
const nowYear = new Date().getFullYear();
for (let w = 1; w <= 18; w++) {
  $("week").insertAdjacentHTML("beforeend", `<option value="${w}"${w === 6 ? " selected" : ""}>Week ${w}</option>`);
}
for (let y = nowYear; y >= nowYear - 6; y--) {
  $("season").insertAdjacentHTML("beforeend", `<option value="${y}">${y}</option>`);
}

async function health() {
  try {
    const r = await fetch("/ready").then(x => x.json());
    const ok = r.ready;
    $("status").innerHTML =
      `<span class="dot ${ok ? "ok" : "bad"}"></span>` +
      `database ${r.checks.database ? "up" : "down"} · ` +
      `model service ${r.checks.ml_service ? "up" : "down"}`;
  } catch { $("status").textContent = "API unreachable"; }
}

// ---- rankings --------------------------------------------------------------
async function loadRankings() {
  const week = $("week").value, season = $("season").value, position = $("position").value;
  $("rankings").innerHTML = `<p class="empty">loading…</p>`;
  showError("");
  try {
    const d = await api(`/rankings?week=${week}&season=${season}&position=${position}&limit=25`);
    $("meta").textContent = d.model_version ? `model: ${d.model_version}` : "";
    if (!d.rankings.length) {
      $("rankings").innerHTML =
        `<p class="empty">No stored projections for ${position} week ${week}, ${season}.<br>
         Run <code>python -m run_weekly</code> to generate them, or use the projection
         panel below for a single player on demand.</p>`;
      return;
    }
    $("rankings").innerHTML = `<table><thead><tr>
        <th class="rank">#</th><th>Player</th><th>Team</th>
        <th class="num">Conf</th><th class="num">Projected</th></tr></thead><tbody>` +
      d.rankings.map(r => `<tr class="clickable" data-id="${r.player_id}">
        <td class="rank">${r.rank}</td><td>${r.name}</td><td>${r.team || "—"}</td>
        <td class="num">${r.confidence != null ? r.confidence.toFixed(2) : "—"}</td>
        <td class="pts">${r.projected_points.toFixed(1)}</td></tr>`).join("") +
      `</tbody></table>`;
    document.querySelectorAll("#rankings tr.clickable").forEach(tr =>
      tr.onclick = () => selectPlayer(Number(tr.dataset.id), tr));
  } catch (e) { showError(e.message); $("rankings").innerHTML = ""; }
}

// ---- player detail ---------------------------------------------------------
async function selectPlayer(id, row) {
  selected = id;
  document.querySelectorAll("#rankings tr").forEach(t => t.classList.remove("selected"));
  if (row) row.classList.add("selected");
  $("project").disabled = false; $("projectAgain").disabled = false;
  $("player").innerHTML = `<p class="empty">loading…</p>`;
  try {
    const season = $("season").value;
    const [p, stats] = await Promise.all([
      api(`/players/${id}`), api(`/players/${id}/stats?season=${season}&limit=20`)
    ]);
    const asc = [...stats].sort((a, b) => a.week - b.week);
    const max = Math.max(1, ...asc.map(s => s.fantasy_points));
    const spark = asc.length ? `
      <div class="spark">${asc.map(s =>
        `<div style="height:${Math.max(2, (s.fantasy_points / max) * 100)}%"
              title="Week ${s.week}: ${s.fantasy_points.toFixed(1)} pts"></div>`).join("")}</div>
      <div class="sparklabels">${asc.map(s => `<span>${s.week}</span>`).join("")}</div>` : "";
    $("player").innerHTML =
      `<div class="kv"><span>Name</span><span>${p.name}</span></div>
       <div class="kv"><span>Team / Position</span><span>${p.team || "—"} · ${p.position}</span></div>
       <div class="kv"><span>Age</span><span>${p.age ?? "—"}</span></div>` + spark +
      (stats.length ? `<table style="margin-top:10px"><thead><tr>
         <th>Wk</th><th>Opp</th><th class="num">Tgt</th><th class="num">Rec</th>
         <th class="num">Yds</th><th class="num">TD</th><th class="num">Pts</th></tr></thead><tbody>` +
        stats.map(s => `<tr><td>${s.week}</td><td>${s.opponent || "—"}</td>
          <td class="num">${s.targets}</td><td class="num">${s.receptions}</td>
          <td class="num">${s.yards.toFixed(0)}</td><td class="num">${s.touchdowns}</td>
          <td class="pts">${s.fantasy_points.toFixed(1)}</td></tr>`).join("") +
        `</tbody></table>` : `<p class="empty">No game log for this season.</p>`);
  } catch (e) { showError(e.message); }
}

// ---- on-demand projection --------------------------------------------------
async function project() {
  if (!selected) return;
  $("project").disabled = true; $("projectAgain").disabled = true;
  const t0 = performance.now();
  try {
    const body = await api("/predict", {
      method: "POST",
      body: JSON.stringify({
        player_id: selected,
        week: Number($("week").value),
        season: Number($("season").value),
        opponent: ($("opponent").value || "UNK").toUpperCase(),
        is_home: true
      })
    });
    const ms = Math.round(performance.now() - t0);
    $("projection").innerHTML =
      `<div class="kv"><span>Projected points</span><span class="pts">${body.prediction.toFixed(1)}</span></div>
       <div class="kv"><span>Confidence</span><span>${body.confidence != null ? body.confidence.toFixed(2) : "—"}</span></div>
       <div class="kv"><span>Model</span><span class="badge">${body.model_version}</span></div>
       <div class="kv"><span>Served from</span>
         <span><span class="badge ${body.source}">${body.source}</span> ${ms} ms</span></div>
       <p class="empty" style="margin-top:10px">Hit <b>Again</b> — the second identical
       request is served from cache and skips inference entirely.</p>`;
  } catch (e) {
    $("projection").innerHTML = `<p class="err">${e.message}</p>`;
  } finally {
    $("project").disabled = false; $("projectAgain").disabled = false;
  }
}

$("refresh").onclick = loadRankings;
$("position").onchange = loadRankings;
$("week").onchange = loadRankings;
$("season").onchange = loadRankings;
$("project").onclick = project;
$("projectAgain").onclick = project;

health();
loadRankings();
setInterval(health, 15000);
</script>
</body>
</html>
