[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008", "UP017"]  # Depends() defaults are idiomatic; UP017 needs py311

[tool.ruff.lint.per-file-ignores]
# Migrations mirror the generated style: long column definitions on one line.
"alembic/versions/*.py" = ["E501"]
"alembic/env.py" = ["E402", "F403", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
plugins = []
ignore_missing_imports = true
