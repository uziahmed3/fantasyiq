name: Retrain models

# Also manual-only until AWS secrets are set - see deploy.yml.
on:
  # schedule:
  #   - cron: "0 12 * * 2" # Tuesdays, after the ETL has landed the new week
  workflow_dispatch:
    inputs:
      promote:
        description: "Promote the winning model to ACTIVE_MODEL_VERSION"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # Training runs inside the VPC as a one-off task so it can read RDS and write the
      # EFS artifact volume the ML service mounts.
      - name: Train and evaluate
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster fantasyiq-prod \
            --task-definition fantasyiq-prod-ml \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.PRIVATE_SUBNET_IDS }}],securityGroups=[${{ secrets.ML_SG_ID }}],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"ml-service","command":["sh","-c","python -m train.train_baseline && python -m train.train_xgboost && python -m train.train_torch && python -m train.evaluate"]}]}' \
            --query 'tasks[0].taskArn' --output text)
          aws ecs wait tasks-stopped --cluster fantasyiq-prod --tasks "$TASK_ARN"
          EXIT=$(aws ecs describe-tasks --cluster fantasyiq-prod --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          echo "training exit code: $EXIT"
          test "$EXIT" = "0"

      # Promotion is deliberately manual by default. A model that trains successfully is
      # not automatically a model worth serving; someone should look at the RMSE table.
      - name: Promotion reminder
        if: ${{ !inputs.promote }}
        run: |
          echo "::notice::New artifacts written. Review the evaluate output, then set"
          echo "::notice::active_model_version in terraform.tfvars and apply to promote."
